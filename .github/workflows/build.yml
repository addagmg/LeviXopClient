name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.1",  compat: v1 }
          - { mc: "1.21.2",  compat: v2 }
          - { mc: "1.21.3",  compat: v2 }
          - { mc: "1.21.4",  compat: v2 }
          - { mc: "1.21.5",  compat: v3 }
          - { mc: "1.21.6",  compat: v4 }
          - { mc: "1.21.7",  compat: v4 }
          - { mc: "1.21.8",  compat: v4 }
          - { mc: "1.21.9",  compat: v5 }
          - { mc: "1.21.10", compat: v5 }
          - { mc: "1.21.11", compat: v6 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Resolve Fabric versions for ${{ matrix.mc }}
        id: v
        run: |
          MC="${{ matrix.mc }}"
          YARN=$(curl -fsS "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[]|select(.stable)][0].version')
          API=$(curl -fsS -G -H "User-Agent: addagmg/LeviXopClient" "https://api.modrinth.com/v2/project/fabric-api/version" \
                --data-urlencode "game_versions=[\"$MC\"]" --data-urlencode 'loaders=["fabric"]' \
                | jq -r '([.[]|select(.version_type=="release")][0] // .[0]).version_number')
          echo "yarn=$YARN loader=$LOADER api=$API"
          echo "yarn=$YARN" >> "$GITHUB_OUTPUT"
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >
          gradle build
          -Pminecraft_version=${{ matrix.mc }}
          -Pcompat=${{ matrix.compat }}
          -Pyarn_mappings=${{ steps.v.outputs.yarn }}
          -Ploader_version=${{ steps.v.outputs.loader }}
          -Pfabric_version=${{ steps.v.outputs.api }}
      - uses: actions/upload-artifact@v4
        with:
          name: LeviXopclient-mc${{ matrix.mc }}
          path: build/libs/*.jar
